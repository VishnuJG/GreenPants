<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>API Response Viewer</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #3b82f6;
      --accent: #93c5fd;
      --gradient-start: #2563eb;
      --gradient-end: #1e40af;
      --success: #16a34a;
      --success-dark: #15803d;
      --error: #dc2626;
      --error-dark: #b91c1c;
      --warning: #d97706;
      --warning-dark: #b45309;
      --info: #0284c7;
      --info-dark: #0369a1;
      --bg-gradient-start: #f8fafc;
      --bg-gradient-end: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --surface: #ffffff;
      --surface-elevated: #ffffff;
      --surface-muted: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --shadow: rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      min-height: 100vh;
      padding: 20px;
      color: var(--text-primary);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: var(--surface-elevated);
      border-radius: 16px;
      padding: 24px 32px;
      margin-bottom: 20px;
      box-shadow: 0 4px 24px var(--shadow);
      border: 1px solid var(--border);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .request-info {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 100%;
    }

    .info-item:has(.url-text) {
      flex: 1;
      min-width: 0;
    }

    .info-label {
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .url-text {
      word-break: break-all;
      overflow-wrap: anywhere;
      flex: 1;
      min-width: 0;
    }

    .method-badge {
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
    }

    .method-get { background: var(--success); color: white; }
    .method-post { background: var(--info); color: white; }
    .method-put { background: var(--warning); color: white; }
    .method-delete { background: var(--error); color: white; }
    .method-patch { background: var(--secondary); color: white; }

    .status-section {
      background: white;
      border-radius: 16px;
      padding: 24px 32px;
      margin-bottom: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 16px;
    }

    .status-success {
      background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
      color: white;
    }

    .status-error {
      background: linear-gradient(135deg, var(--error) 0%, var(--error-dark) 100%);
      color: white;
    }

    .status-pending {
      background: linear-gradient(135deg, var(--warning) 0%, var(--warning-dark) 100%);
      color: white;
    }

    .duration {
      font-size: 14px;
      color: var(--text-muted);
      margin-left: auto;
    }

    .content-section {
      background: var(--surface-elevated);
      border-radius: 16px;
      padding: 24px 32px;
      margin-bottom: 20px;
      box-shadow: 0 4px 24px var(--shadow);
      border: 1px solid var(--border);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .copy-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }

    .copy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px color-mix(in srgb, var(--primary) 40%, transparent);
    }

    .copy-btn:active {
      transform: translateY(0);
    }

    .copy-btn.copied {
      background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
    }

    .code-block {
      background: #0f172a;
      color: var(--success);
      padding: 20px;
      border-radius: 12px;
      font-family: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Menlo', monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 600px;
      overflow-y: auto;
    }

    .code-block::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .code-block::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 4px;
    }

    .code-block::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }

    .code-block::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 40px;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      color: var(--text-secondary);
      font-size: 18px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: #fef2f2;
      border: 2px solid #fecaca;
      border-radius: 10px;
      padding: 16px;
      color: #b91c1c;
      margin-top: 16px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 12px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-secondary);
    }

    .tab-btn:hover {
      border-color: var(--primary);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      color: white;
      box-shadow: 0 4px 16px color-mix(in srgb, var(--primary) 30%, transparent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
  <script type="module">
    import { loadTheme } from './scripts/theme-manager.js';
    loadTheme();
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 API Response Viewer</h1>
      <div class="request-info" id="requestInfo">
        <div class="info-item">
          <span class="info-label">Loading...</span>
        </div>
      </div>
    </div>

    <div id="loadingState" class="loading">
      <div class="spinner"></div>
      <div>Waiting for response...</div>
    </div>

    <div id="responseContent" style="display: none;">
      <div class="status-section" id="statusSection"></div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="body">📦 Response Body</button>
        <button class="tab-btn" data-tab="headers">📋 Headers</button>
        <button class="tab-btn" data-tab="raw">🔍 Raw</button>
      </div>

      <div class="tab-content active" id="body-content">
        <div class="content-section">
          <div class="section-header">
            <div class="section-title">📦 Response Body</div>
            <button class="copy-btn" id="copyBody">📋 Copy Body</button>
          </div>
          <div class="code-block" id="bodyContent"></div>
        </div>
      </div>

      <div class="tab-content" id="headers-content">
        <div class="content-section">
          <div class="section-header">
            <div class="section-title">📋 Response Headers</div>
            <button class="copy-btn" id="copyHeaders">📋 Copy Headers</button>
          </div>
          <div class="code-block" id="headersContent"></div>
        </div>
      </div>

      <div class="tab-content" id="raw-content">
        <div class="content-section">
          <div class="section-header">
            <div class="section-title">🔍 Raw Response</div>
            <button class="copy-btn" id="copyRaw">📋 Copy Raw</button>
          </div>
          <div class="code-block" id="rawContent"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/response-viewer.js"></script>
</body>
</html>
